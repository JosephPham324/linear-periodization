<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bald Omni-Man's Linear Periodization Calc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.01em;
        }
    </style>
    <link rel="stylesheet" href="public/css/app.css">
</head>

<body class="bg-[#F8FAFC] text-slate-900 min-h-screen pb-20">

    <div class="max-w-5xl mx-auto px-4 py-12">
        <header class="mb-12 text-center">
            <h1 class="text-5xl font-[900] tracking-tighter text-slate-900 mb-2 italic uppercase">BALD <span
                    class="text-indigo-600">OMNI-MAN</span></h1>
            <p class="text-slate-500 text-lg font-medium">Linear Periodization & Peaking System</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <div class="glass-card p-8 mb-0">
                <label class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 block">Current 1-Rep
                    Max</label>
                <div class="relative">
                    <input type="text" id="oneRM" value="100" step="2.5" class="input-field">
                    <span
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 font-black text-xs">KG/LB</span>
                </div>
            </div>
            <div class="glass-card p-8 mb-0">
                <label class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 block">Smallest
                    Increment</label>
                <input type="text" id="increment" value="2.5" step="0.5" class="input-field">
            </div>
        </div>

        <div class="flex p-2 bg-slate-200/50 rounded-[2rem] mb-12 w-fit mx-auto md:mx-0 border border-white/50">
            <button onclick="switchTab('5rm')" id="tab-5rm"
                class="px-10 py-3 rounded-[1.5rem] font-bold transition-all duration-300 tab-active">5RM Block</button>
            <button onclick="switchTab('1rm')" id="tab-1rm"
                class="px-10 py-3 rounded-[1.5rem] font-bold transition-all duration-300 ml-2 tab-inactive">1RM
                Block</button>
        </div>

        <div class="glass-card">
            <div class="phase-header bg-green-700">
                <h2 class="font-black text-sm uppercase tracking-[0.2em]">Phase I: Volumetric Base</h2>
                <span class="text-[10px] bg-white/20 px-2 py-1 rounded">Weeks 1 - 4</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left table-fixed">
                    <thead class="bg-slate-700 text-white">
                        <tr>
                            <th class="w-[12%] px-6 py-4 text-[10px] font-black uppercase tracking-widest text-center">
                                Week</th>
                            <th class="w-[20%] px-6 py-4 text-[10px] font-black uppercase tracking-widest text-center">
                                Load (Top)</th>
                            <th class="w-[20%] px-6 py-4 text-[10px] font-black uppercase tracking-widest text-center">
                                Load (Back)</th>
                            <th class="w-[48%] px-6 py-4 text-[10px] font-black uppercase tracking-widest">Prescription
                            </th>
                        </tr>
                    </thead>
                    <tbody id="phase1-body"></tbody>
                </table>
            </div>
        </div>

        <div class="glass-card">
            <div class="phase-header bg-green-700">
                <h2 class="font-black text-sm uppercase tracking-[0.2em]">Phase II: Intensification & Peak</h2>
                <span class="text-[10px] bg-white/20 px-2 py-1 rounded">Weeks 5 - 10</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left table-fixed">
                    <thead class="bg-slate-700 text-white">
                        <tr>
                            <th class="w-[12%] px-6 py-4 text-[10px] font-black uppercase tracking-widest text-center">
                                Week</th>
                            <th class="w-[20%] px-6 py-4 text-[10px] font-black uppercase tracking-widest text-center">
                                Load (Top)</th>
                            <th class="w-[20%] px-6 py-4 text-[10px] font-black uppercase tracking-widest text-center">
                                Load (Back)</th>
                            <th class="w-[48%] px-6 py-4 text-[10px] font-black uppercase tracking-widest">Prescription
                            </th>
                        </tr>
                    </thead>
                    <tbody id="phase2-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const oneRMInput = document.getElementById('oneRM');
        const incrementInput = document.getElementById('increment');
        const phase1Body = document.getElementById('phase1-body');
        const phase2Body = document.getElementById('phase2-body');

        let currentMode = '5rm';
        const mround = (value, factor) => Math.round(value / factor) * factor;

        let commonPres = {
            '1RM': [
                "3 sets repped to 3 Reps In Reserve",
                "1 set repped to 1 Rep In Reserve",
                "2 sets rep to 2 RIR",
                "2 sets rep to 1 RIR",
                "Perform 2 sets while trying to keep 2-3 reps in the tank. Additional set taken to failure."
            ],
            '5RM': [
                "2 sets (2-3 RIR) + 1 set to failure to drive intensity & audit performance.",
                "3 sets (1-2 RIR). No failure sets. Drop accessories if fatigued.",
                "5+ Rep Max. If >10 reps, rest 3-4m and add 2.5-5 per extra rep above 5."
            ]
        };

        const programs = {
            '5rm': [
                { wk: 1, top: 0.63, back: null, note: commonPres['5RM'][0], backNote: null },
                { wk: 2, top: 0.66, back: null, note: commonPres['5RM'][0], backNote: null },
                { wk: 3, top: 0.69, back: null, note: commonPres['5RM'][0], backNote: null },
                { wk: 4, top: 0.72, back: null, note: commonPres['5RM'][0], backNote: null },
                { wk: 5, top: 0.75, back: null, note: commonPres['5RM'][1], backNote: null },
                { wk: 6, top: 0.78, back: null, note: commonPres['5RM'][1], backNote: null },
                { wk: 7, top: 0.81, back: null, note: commonPres['5RM'][1], backNote: null },
                { wk: 8, top: 0.85, back: null, note: commonPres['5RM'][2], backNote: null },
                { wk: 9, top: 0.90, back: null, note: commonPres['5RM'][2], backNote: null },
                { wk: 10, top: 1.00, back: null, note: commonPres['5RM'][2], backNote: null }
            ],
            '1rm': [
                { wk: 1, top: 0.63, back: null, note: commonPres['1RM'][0], backNote: null },
                { wk: 2, top: 0.67, back: null, note: commonPres['1RM'][0], backNote: null },
                { wk: 3, top: 0.71, back: null, note: commonPres['1RM'][0], backNote: null },
                { wk: 4, top: 0.75, back: null, note: commonPres['1RM'][0], backNote: null },
                { wk: 5, top: 0.83, back: 0.73, note: commonPres['1RM'][1], backNote: commonPres['1RM'][2] },
                { wk: 6, top: 0.86, back: 0.76, note: commonPres['1RM'][1], backNote: commonPres['1RM'][2] },
                { wk: 7, top: 0.89, back: 0.79, note: commonPres['1RM'][1], backNote: commonPres['1RM'][3] },
                { wk: 8, top: 0.93, back: 0.82, note: 'Heavy Single', backNote: commonPres['1RM'][3] },
                { wk: 9, top: 0.95, back: 0.85, note: 'Heavy Single', backNote: commonPres['1RM'][3] },
                { wk: 10, top: 1.00, back: 0.85, note: 'Max Effort Single', backNote: "2 sets rep to 0 RIR" }
            ]
        };

        function getIntensityColor(pct) {
            if (pct < 0.70) return 'bg-emerald-100 text-emerald-700';
            if (pct < 0.85) return 'bg-amber-100 text-amber-700';
            return 'bg-rose-100 text-rose-700';
        }

        function generateRows(rows, rm, inc) {
            return rows.map(row => {
                const mainWeight = mround(rm * row.top, inc);
                const backWeight = row.back ? mround(rm * row.back, inc) : null;
                const intensityColor = getIntensityColor(row.top);

                return `
                <tr class="hover:bg-slate-50 transition-all">
                    <td class="px-6 py-6 font-black text-slate-800 text-xl text-center">W${row.wk}</td>
                    <td class="px-6 py-6 text-center">
                        <div class="weight-badge-top">${mainWeight}</div>
                        <div class="mt-2 text-[10px] font-black uppercase tracking-widest ${intensityColor} rounded px-1 inline-block">
                            ${Math.round(row.top * 100)}%
                        </div>
                    </td>
                    <td class="px-6 py-6 text-center">
                        ${backWeight ? `
                            <div class="weight-badge-back">${backWeight}</div>
                            <div class="mt-2 text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${Math.round(row.back * 100)}%</div>
                        ` : '<div class="w-8 h-1 bg-slate-100 mx-auto rounded-full"></div>'}
                    </td>
                    <td class="px-6 py-6 text-sm">
                        <div class="max-w-full">
                            <p class="text-slate-700 font-semibold leading-relaxed mb-2">${row.note}</p>
                            ${row.backNote ? `
                                <div class="bg-indigo-50 border border-indigo-100 p-2 rounded-lg text-[11px] font-medium text-indigo-700">
                                    <span class="font-black uppercase tracking-tighter mr-1 text-[9px]">Backdown:</span> ${row.backNote}
                                </div>
                            ` : ''}
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-5rm').className = mode === '5rm' ? "px-10 py-3 rounded-[1.5rem] font-bold transition-all duration-300 tab-active" : "px-10 py-3 rounded-[1.5rem] font-bold transition-all duration-300 ml-2 tab-inactive";
            document.getElementById('tab-1rm').className = mode === '1rm' ? "px-10 py-3 rounded-[1.5rem] font-bold transition-all duration-300 ml-2 tab-active" : "px-10 py-3 rounded-[1.5rem] font-bold transition-all duration-300 ml-2 tab-inactive";
            render();
        }

        function render() {
            const rm = parseFloat(oneRMInput.value) || 0;
            const inc = parseFloat(incrementInput.value) || 0.5;
            const data = programs[currentMode];

            phase1Body.innerHTML = generateRows(data.slice(0, 4), rm, inc);
            phase2Body.innerHTML = generateRows(data.slice(4), rm, inc);
        }

        [oneRMInput, incrementInput].forEach(el => el.addEventListener('input', render));
        render();
    </script>
</body>

</html>
